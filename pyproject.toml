[project]
name = "event-scraper"
version = "0.1.0"
description = "City event scraper: collects upcoming social events, normalises to canonical JSON, categorises, dedupes, exports a static feed."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "hishel>=1.1",
    "selectolax>=0.4",
    "chompjs>=1.4",
    "ultimate-sitemap-parser>=1.5",
    "protego>=0.5",
    "tenacity>=9.0",
    "rapidfuzz>=3.10",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "anthropic>=0.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
