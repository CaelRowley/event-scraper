name: test

on:
  push:
    paths: ["src/**", "tests/**", "pyproject.toml", "uv.lock", ".github/workflows/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      # --frozen: test exactly what the scrape job will install, and fail if
      # pyproject.toml and uv.lock have drifted apart.
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q
