name: scrape

on:
  schedule:
    - cron: "0 3 * * *"   # full: delta crawl + dedup + Haiku batch + export (~05:00 Berlin)
    - cron: "0 13 * * *"  # delta: cheap-delta sources only (~15:00 Berlin)
  workflow_dispatch:
    inputs:
      mode:
        description: "run mode"
        default: "full"
        type: choice
        options: [full, delta]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pinned: parsing stack tested here
          cache: pip

      - run: pip install -e .

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 13 * * *' && 'delta' || 'full') }}
          # repo variable (Settings → Variables): set to a positive number for a
          # quick dev smoke run — caps events/source and skips D1 sync + commit
          # (see below). 0 (or unset) = normal full scrape.
          SCRAPE_LIMIT: ${{ vars.SCRAPE_LIMIT }}
        run: |
          ARGS="--city berlin --mode $MODE"
          if [ "${SCRAPE_LIMIT:-0}" -gt 0 ] 2>/dev/null; then
            echo "::notice::DEV MODE — capping at $SCRAPE_LIMIT events/source; D1 sync + commit skipped"
            ARGS="$ARGS --limit $SCRAPE_LIMIT"
          fi
          python -m pipeline run $ARGS | tee telemetry.json

      - name: Freshness / yield alert
        run: |
          python - <<'EOF'
          import json, sys
          t = json.load(open("telemetry.json"))
          total = sum(t["sources"].values())
          print(f"ingested {total} events from {len(t['sources'])} sources; errors: {t['errors']}")
          if total == 0:
              sys.exit("ALERT: zero events ingested — every source failed or yielded nothing")
          if len(t["errors"]) >= 3:
              sys.exit(f"ALERT: {len(t['errors'])} sources failed: {list(t['errors'])}")
          EOF

      # push the export window into Gobento's Cloudflare D1 (city_events table).
      # runs only after the freshness gate above passes, so a zero/failed scrape
      # never reaches D1 (and sync-d1 itself refuses to prune on empty results).
      - name: Sync to D1
        if: vars.SCRAPE_LIMIT == '' || vars.SCRAPE_LIMIT == '0'   # dev mode (positive limit) must never prune production D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -m pipeline sync-d1 --city berlin

      # commit DB + exported JSON: storage, serving (Pages), and the 60-day
      # scheduled-workflow keep-alive in one step
      - name: Commit data
        if: vars.SCRAPE_LIMIT == '' || vars.SCRAPE_LIMIT == '0'   # dev mode must not commit a truncated dataset
        run: |
          git config user.name "scrape-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ public/
          git diff --cached --quiet || git commit -m "data: $(date -u +%F-%H%M)"
          git push

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
