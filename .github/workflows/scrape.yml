name: scrape

on:
  schedule:
    - cron: "0 3 * * *"   # full: delta crawl + dedup + Haiku batch + export (~05:00 Berlin)
    - cron: "0 13 * * *"  # delta: cheap-delta sources only (~15:00 Berlin)
  workflow_dispatch:
    inputs:
      mode:
        description: "run mode"
        default: "full"
        type: choice
        options: [full, delta]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pinned: parsing stack tested here
          cache: pip

      - run: pip install -e .

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 13 * * *' && 'delta' || 'full') }}
        run: python -m pipeline run --city berlin --mode "$MODE" | tee telemetry.json

      - name: Freshness / yield alert
        run: |
          python - <<'EOF'
          import json, sys
          t = json.load(open("telemetry.json"))
          total = sum(t["sources"].values())
          print(f"ingested {total} events from {len(t['sources'])} sources; errors: {t['errors']}")
          if total == 0:
              sys.exit("ALERT: zero events ingested — every source failed or yielded nothing")
          if len(t["errors"]) >= 3:
              sys.exit(f"ALERT: {len(t['errors'])} sources failed: {list(t['errors'])}")
          EOF

      # commit DB + exported JSON: storage, serving (Pages), and the 60-day
      # scheduled-workflow keep-alive in one step
      - name: Commit data
        run: |
          git config user.name "scrape-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ public/
          git diff --cached --quiet || git commit -m "data: $(date -u +%F-%H%M)"
          git push

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
