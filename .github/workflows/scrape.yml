name: scrape

on:
  schedule:
    # Two runs a day. The full run is the authoritative refresh of the whole
    # window; the delta run exists so an event announced with a few days' notice
    # is not invisible for up to 24 hours. Keep the cron strings byte-identical
    # to the MODE expression below — that is what distinguishes them.
    - cron: "0 3 * * *"    # full: every source, crawl + dedup + enrich + export (~05:00 Berlin)
    - cron: "0 13 * * *"   # delta: cheap_delta sources only (~15:00 Berlin)
  workflow_dispatch:
    inputs:
      mode:
        description: "run mode"
        default: "full"
        type: choice
        options: [full, delta]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      # Installs exactly what uv.lock says. `pip install -e .` resolved fresh on
      # every run, so selectolax 1.0 shipping (2026-10-03) broke every scrape for
      # three weeks without a line of this repo changing. Upgrades now arrive as
      # Dependabot PRs, tested before they can reach this job.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"   # pinned: parsing stack tested here
          activate-environment: true
          enable-cache: true

      - run: uv sync --frozen

      # data/ (SQLite DB + HTTP cache) persists between runs via the cache, NOT git —
      # the delta ledgers, image-scan ledger and detail caches all live there.
      # A cache miss costs one slow cold run and nothing else: event ids are
      # derived from the source listing (ids.py), so a rebuilt database
      # reproduces them exactly.
      - name: Restore data
        uses: actions/cache/restore@v6
        with:
          path: data
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      - name: Run pipeline
        env:
          # Optional relay for sources that refuse this runner's IP (PROXIED_HOSTS).
          # Unset, they stay blocked and the source health step warns about it.
          FETCH_PROXY_URL: ${{ secrets.FETCH_PROXY_URL }}
          FETCH_PROXY_TOKEN: ${{ secrets.FETCH_PROXY_TOKEN }}
          # Accept the original documented name and the TICKET_MASTER_KEY name
          # already configured in this repository; the Python adapter reads the
          # normalized TICKETMASTER_KEY environment variable either way.
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY || secrets.TICKET_MASTER_KEY }}
          # Scheduled runs pick their mode from which cron fired; a manual run
          # uses its input. `github.event.schedule` is empty for workflow_dispatch,
          # so the dispatch input always wins.
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 13 * * *' && 'delta' || 'full') }}
          # repo variable (Settings → Variables): set to a positive number for a
          # quick dev smoke run — caps events/source and makes the R2 publish
          # upload-only (see below). 0 (or unset) = normal full scrape.
          SCRAPE_LIMIT: ${{ vars.SCRAPE_LIMIT }}
        run: |
          set -o pipefail
          ARGS="--city berlin --mode $MODE"
          if [ "${SCRAPE_LIMIT:-0}" -gt 0 ] 2>/dev/null; then
            echo "::notice::DEV MODE — capping at $SCRAPE_LIMIT events/source; sync is upsert-only"
            ARGS="$ARGS --limit $SCRAPE_LIMIT"
          fi
          python -m pipeline run $ARGS | tee telemetry.json

      # Hard gate: only what would make the feed itself wrong stops it publishing.
      # Everything else is reported by the health check after publish — a refused
      # source or a failed enrichment phase used to block the whole feed, which is
      # how three sources that could contribute nothing kept it stale.
      - name: Freshness gate
        run: |
          python - <<'EOF'
          import json, sys
          t = json.load(open("telemetry.json"))
          total = sum(t["sources"].values())
          failed, ran = len(t["errors"]), len(t["sources"])
          print(f"ingested {total} events; {failed} of {ran} sources failed")
          if total == 0:
              sys.exit("ALERT: zero events ingested — every source failed or yielded nothing")
          # A majority failing smells like something systemic (network, a bad
          # deploy) rather than a source or two having a bad day.
          if failed * 2 > ran:
              sys.exit(f"ALERT: {failed} of {ran} sources failed: {list(t['errors'])}")
          EOF

      # save only after the freshness gate: a failed or zero-yield run must not
      # persist its (possibly corrupt/empty) state as the next run's starting point
      - name: Save data
        run: |
          # unbounded-growth guard: a cold HTTP cache self-heals, the pipeline DB must stay
          if [ -f data/http_cache.db ] && [ "$(stat -c%s data/http_cache.db)" -gt 262144000 ]; then
            echo "::notice::http_cache.db over 250MB — dropping it (self-heals next run)"
            rm -f data/http_cache.db*
          fi
      - uses: actions/cache/save@v6
        with:
          path: data
          key: pipeline-data-${{ github.run_id }}

      # Publish the exported feed to Cloudflare R2 — the objects Gobento reads.
      # Runs only after the freshness gate above passes, so a zero/failed scrape
      # never reaches the bucket (and publish itself refuses to prune when the
      # feed is empty or far smaller than what the bucket holds). Uploads are a
      # diff: content-addressed names mean a steady-state run ships only the
      # events that actually changed, plus feed and manifest.
      - name: Publish feed to R2
        id: publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SCRAPE_LIMIT: ${{ vars.SCRAPE_LIMIT }}
        run: |
          # A limited (dev) scrape only covers part of the window, so publish
          # upload-only (--no-prune): it adds its objects without de-listing the
          # real ones it never re-emitted. Full runs prune as normal.
          ARGS="--city berlin"
          if [ "${SCRAPE_LIMIT:-0}" -gt 0 ] 2>/dev/null; then
            echo "::notice::DEV MODE — publishing upload-only (--no-prune)"
            ARGS="$ARGS --no-prune"
          fi
          python -m pipeline publish $ARGS

      # After publish, so it can fail the run without holding the feed back.
      # Red here means "look at this", not "the feed is stale".
      - name: Source health
        run: |
          python - <<'EOF'
          import json, sys
          t = json.load(open("telemetry.json"))
          live = {k: v for k, v in t["sources"].items() if v}
          print(f"{len(live)} of {len(t['sources'])} sources yielded events: {t['sources']}")
          print(f"seconds: {t.get('seconds')}")
          problems = []
          for slug, err in t["errors"].items():
              problems.append(f"source {slug} failed: {err}")
          # A source that logged an HTTP block and yielded nothing never reaches
          # `errors` — adapters contain those and return empty. Zero yield alone is
          # not the signal (a sitemap source with no new pages is healthy); every
          # request being refused is.
          # Blocks are reported, not failed on: they come from the runner's IP
          # (tip-berlin WAFs GitHub's ranges; the relay gets the same 403s), so
          # no change to this repo fixes them and a red run every day for it
          # would only teach everyone to ignore red. Errors and phases still fail.
          for slug in t.get("blocked_sources", []):
              print(f"::warning::source {slug} is blocking this runner's IP")
          for phase, err in t.get("phase_errors", {}).items():
              problems.append(f"phase {phase}: {err}")
          for host in t.get("tripped_hosts", []):
              print(f"::notice::{host} refused repeatedly and was skipped for the rest of the run")
          for p in problems:
              print(f"::warning::{p}")
          if problems:
              sys.exit(f"{len(problems)} problem(s) — the feed was still published")
          EOF

      # A failed run before publish is invisible to users — they keep seeing
      # yesterday's feed, because the last manifest still resolves. Say so loudly
      # here; the client also surfaces `generated_at`, so staleness shows in the UI.
      - name: Report stale feed
        if: failure() && steps.publish.outcome != 'success'
        run: |
          echo "::error::Scrape failed — the published feed is now stale."
          echo "::error::Clients keep serving the last good manifest until this succeeds."

      # The exported feed is NOT committed: R2 (above) is its only consumer, and
      # public/berlin/ is gitignored. What still needs a commit is the schedule
      # itself — GitHub disables a scheduled workflow after 60 days without repo
      # activity — so land one only when the branch is actually going stale.
      # Normal development resets the clock on its own and this stays a no-op.
      - name: Keep schedule alive
        if: github.event.schedule == '0 3 * * *'
        run: |
          age_days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$age_days" -lt 50 ]; then
            echo "last commit ${age_days}d ago — schedule is safe, nothing to commit"
            exit 0
          fi
          git config user.name "scrape-bot"
          git config user.email "actions@users.noreply.github.com"
          date -u +%FT%TZ > .github/last-keepalive
          git add .github/last-keepalive
          git commit -m "chore: keep scheduled workflow alive"
          git push

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q
