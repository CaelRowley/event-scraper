name: scrape

on:
  schedule:
    - cron: "0 3 * * *"   # daily full run: crawl + dedup + Haiku batch + export (~05:00 Berlin)
  workflow_dispatch:
    inputs:
      mode:
        description: "run mode"
        default: "full"
        type: choice
        options: [full, delta]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # pinned: parsing stack tested here
          cache: pip

      - run: pip install -e .

      # data/ (SQLite DB + HTTP cache) persists between runs via the cache, NOT git —
      # the delta ledgers, image-scan ledger, detail caches, and pending LLM batch id
      # all live there. A cache miss just means one slower cold run.
      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: pipeline-data-${{ github.run_id }}
          restore-keys: pipeline-data-

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Accept the original documented name and the TICKET_MASTER_KEY name
          # already configured in this repository; the Python adapter reads the
          # normalized TICKETMASTER_KEY environment variable either way.
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY || secrets.TICKET_MASTER_KEY }}
          MODE: ${{ github.event.inputs.mode || 'full' }}
          # repo variable (Settings → Variables): set to a positive number for a
          # quick dev smoke run — caps events/source and makes the D1 sync
          # upsert-only (see below). 0 (or unset) = normal full scrape.
          SCRAPE_LIMIT: ${{ vars.SCRAPE_LIMIT }}
        run: |
          set -o pipefail
          # --llm-poll 300: wait ≤5 min for the Haiku batch; an unfinished batch is
          # collected at the start of the next run (pending_batch_id in the kv table)
          ARGS="--city berlin --mode $MODE --llm-poll 300"
          if [ "${SCRAPE_LIMIT:-0}" -gt 0 ] 2>/dev/null; then
            echo "::notice::DEV MODE — capping at $SCRAPE_LIMIT events/source; sync is upsert-only"
            ARGS="$ARGS --limit $SCRAPE_LIMIT"
          fi
          python -m pipeline run $ARGS | tee telemetry.json

      - name: Freshness / yield alert
        run: |
          python - <<'EOF'
          import json, sys
          t = json.load(open("telemetry.json"))
          total = sum(t["sources"].values())
          print(f"ingested {total} events from {len(t['sources'])} sources; errors: {t['errors']}")
          if total == 0:
              sys.exit("ALERT: zero events ingested — every source failed or yielded nothing")
          if len(t["errors"]) >= 3:
              sys.exit(f"ALERT: {len(t['errors'])} sources failed: {list(t['errors'])}")
          EOF

      # save only after the freshness gate: a failed or zero-yield run must not
      # persist its (possibly corrupt/empty) state as the next run's starting point
      - name: Save data
        run: |
          # unbounded-growth guard: a cold HTTP cache self-heals, the pipeline DB must stay
          if [ -f data/http_cache.db ] && [ "$(stat -c%s data/http_cache.db)" -gt 262144000 ]; then
            echo "::notice::http_cache.db over 250MB — dropping it (self-heals next run)"
            rm -f data/http_cache.db*
          fi
      - uses: actions/cache/save@v4
        with:
          path: data
          key: pipeline-data-${{ github.run_id }}

      # push the export window into Gobento's Cloudflare D1 (city_events table).
      # runs only after the freshness gate above passes, so a zero/failed scrape
      # never reaches D1 (and sync-d1 itself refuses to prune on empty results).
      - name: Sync to D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SCRAPE_LIMIT: ${{ vars.SCRAPE_LIMIT }}
        run: |
          # A limited (dev) scrape only covers part of the window, so sync
          # upsert-only (--no-prune): it adds/updates its rows without deleting
          # the real rows it never re-emitted. Full runs prune as normal.
          ARGS="--city berlin"
          if [ "${SCRAPE_LIMIT:-0}" -gt 0 ] 2>/dev/null; then
            echo "::notice::DEV MODE — syncing upsert-only (--no-prune)"
            ARGS="$ARGS --no-prune"
          fi
          python -m pipeline sync-d1 $ARGS

      # The exported feed is NOT committed: D1 (above) is its only consumer, and
      # public/berlin/ is gitignored. What still needs a commit is the schedule
      # itself — GitHub disables a scheduled workflow after 60 days without repo
      # activity — so land one only when the branch is actually going stale.
      # Normal development resets the clock on its own and this stays a no-op.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          age_days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$age_days" -lt 50 ]; then
            echo "last commit ${age_days}d ago — schedule is safe, nothing to commit"
            exit 0
          fi
          git config user.name "scrape-bot"
          git config user.email "actions@users.noreply.github.com"
          date -u +%FT%TZ > .github/last-keepalive
          git add .github/last-keepalive
          git commit -m "chore: keep scheduled workflow alive"
          git push

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
